<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Panel de administración</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app-admin">
    <aside class="barra-admin">
      <h1>Panel de proyectos</h1>
      <p class="subtitulo">Gestiona tus aplicaciones y sus páginas</p>

      <div class="barra-admin__herramientas">
        <input type="search" id="buscar-panel" class="buscar-panel" placeholder="🔍 Buscar proyectos y páginas…" autocomplete="off" />
        <button type="button" class="boton-fantasma boton-fantasma--compacto" id="btn-deshacer" title="Deshacer último cambio">↩ Deshacer</button>
      </div>

      <button class="boton-fantasma" id="btn-nuevo-proyecto">+ Nuevo proyecto</button>
      <ul class="lista-proyectos" id="lista-proyectos"></ul>

      <div class="separador"></div>
      <div class="panel-paginas">
        <h2>Páginas del proyecto</h2>
        <ul class="lista-paginas" id="lista-paginas"></ul>
        <button class="boton-fantasma" id="btn-nueva-pagina">+ Nueva página</button>
      </div>

      <br />
      <button class="boton-fantasma" id="btn-biblioteca-imagenes">🖼 Biblioteca de imágenes</button>
      <button class="boton-fantasma" id="btn-reiniciar">↺ Reiniciar todo</button>
      <br /><br />
      <a class="enlace-previa" href="app.html" target="_blank" style="color:#dce8f2;">Ver sitio completo →</a>
    </aside>
    <section class="contenido-admin" id="contenido-admin">
      <!-- El editor de la página seleccionada se dibuja aquí -->
    </section>
  </div>

  <script src="js/store.js"></script>
  <script src="js/render.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/admin-utils.js"></script>
  <script src="js/admin.js"></script>
  <script src="js/motion.js"></script>
</body>
</html>
